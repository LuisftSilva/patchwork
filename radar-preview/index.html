<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <title>Cannabis Intelligence Radar</title>
  <meta name="description" content="European medicinal cannabis intelligence — markets, companies, products, regulation and commercial opportunities in one workspace." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="partner-network.css" />
  <style>
    .skip-link{position:fixed;left:12px;top:8px;z-index:10000;transform:translateY(-160%);padding:9px 12px;border-radius:7px;background:#fff;color:#07110d;font:700 13px/1 system-ui,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.35)}
    .skip-link:focus{transform:translateY(0);outline:3px solid #7fd5a3;outline-offset:2px}
    :focus-visible{outline:2px solid #9bd8b3;outline-offset:3px}
    #feedStatus{display:none;padding:10px 16px;background:#2b2110;color:#fff3c4;border-bottom:1px solid #72551a;font:600 13px/1.45 system-ui,sans-serif}
    #feedStatus[aria-hidden="false"]{display:block}
    #feedStatus .feed-retry{margin-left:10px;padding:5px 9px;border:1px solid #c8a95b;border-radius:6px;background:transparent;color:#fff3c4;font:700 12px/1 system-ui,sans-serif;cursor:pointer}
    #liveFeed{display:none;margin:12px 18px 0;padding:14px 16px;border:1px solid rgba(120,190,150,.28);border-radius:12px;background:rgba(15,38,28,.72);font:13px/1.45 system-ui,sans-serif}
    #liveFeed[aria-hidden="false"]{display:block}
    #liveFeedHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    #liveFeedHeader strong{font-size:14px;color:#d8f3e3}
    #liveFeedHeader span{color:#9fc2ad;font-size:12px}
    #liveFeedItems{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
    .live-feed-item{padding:10px 11px;border:1px solid rgba(120,190,150,.18);border-radius:9px;background:rgba(5,20,13,.5)}
    .live-feed-item h3{font-size:13px;line-height:1.35;margin:0 0 3px;color:#edf8f1}
    .live-feed-meta{margin:0 0 6px!important;color:#91ad9a!important;font-size:11px;line-height:1.35}
    .live-feed-item p{margin:0 0 5px;color:#bdd2c4}
    .live-feed-item a{color:#9bd8b3;text-decoration:underline;text-underline-offset:2px}
    @media(max-width:640px){#liveFeed{margin:8px 10px 0;padding:11px}#liveFeedHeader{align-items:flex-start;flex-direction:column;gap:2px}#liveFeedItems{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="feedStatus" role="status" aria-live="polite" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation"></aside>
    <div id="backdrop" class="backdrop" hidden></div>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <section id="liveFeed" role="region" aria-labelledby="liveFeedTitle" aria-hidden="true">
        <div id="liveFeedHeader"><strong id="liveFeedTitle">Validated live intelligence</strong><span id="liveFeedFreshness"></span></div>
        <div id="liveFeedItems"></div>
      </section>
      <main id="main" class="main" tabindex="-1"></main>
    </section>
    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
    <div id="commandPalette" class="command-palette" hidden></div>
    <aside id="drawer" class="drawer" aria-hidden="true"></aside>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  </div>
  <script src="data.js"></script>
  <script>
    window.RADAR_PUBLIC_FEED = null;
    window.RADAR_PUBLIC_FEED_READY = fetch('public-data/latest.json', {cache: 'no-store'})
      .then(function (response) {
        if (!response.ok) throw new Error('feed-unavailable');
        var contentType = response.headers.get('content-type') || '';
        if (contentType && contentType.indexOf('json') === -1) throw new Error('feed-invalid');
        return response.json().catch(function () { throw new Error('feed-invalid'); });
      })
      .then(function (feed) {
        var allowed = ['metric_id','metric_name','title','client_summary','geography','source_url','period_end','cadence'];
        var requiredText = ['metric_id','metric_name','title','client_summary','geography','cadence'];
        var seenObservations = Object.create(null);
        var now = Date.now();
        var todayUtc = new Date(now).toISOString().slice(0, 10);
        var valid = feed && feed.schema_version === 1 && typeof feed.generated_at === 'string' && Array.isArray(feed.items) && feed.items.length > 0 && feed.items.length <= 250;
        if (valid) {
          valid = feed.items.every(function (item) {
            if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
            var keys = Object.keys(item).sort();
            if (keys.length !== allowed.length || !allowed.every(function (key) { return keys.indexOf(key) !== -1; })) return false;
            if (!requiredText.every(function (key) { return typeof item[key] === 'string' && item[key].trim().length > 0 && item[key].length <= 2000; })) return false;
            var observationKey = item.metric_id + '^@' + item.geography;
            if (seenObservations[observationKey]) return false;
            seenObservations[observationKey] = true;
            if (typeof item.source_url !== 'string' || item.source_url.length > 2048) return false;
            try {
              var source = new URL(item.source_url);
              if (source.protocol !== 'https:' || !source.hostname || source.username || source.password) return false;
            } catch (error) { return false; }
            if (typeof item.period_end !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(item.period_end)) return false;
            var periodEnd = Date.parse(item.period_end + 'T00:00:00Z');
            if (!Number.isFinite(periodEnd) || item.period_end > todayUtc) return false;
            return true;
          });
        }
        if (!valid) throw new Error('feed-invalid');
        var parsed = Date.parse(feed.generated_at);
        var age = Number.isFinite(parsed) ? now - parsed : Infinity;
        if (!Number.isFinite(parsed) || age < 0) throw new Error('feed-invalid');
        if (age > 48 * 60 * 60 * 1000) throw new Error('feed-stale');
        window.RADAR_PUBLIC_FEED = feed;
        document.documentElement.setAttribute('data-feed-state', 'current');

        var region = document.getElementById('liveFeed');
        var items = document.getElementById('liveFeedItems');
        var freshness = document.getElementById('liveFeedFreshness');
        freshness.textContent = 'Feed refreshed ' + new Date(parsed).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) + ' · ' + feed.items.length + ' verified updates';
        feed.items.forEach(function (item) {
          var card = document.createElement('article');
          card.className = 'live-feed-item';
          var title = document.createElement('h3');
          title.textContent = item.title;
          var meta = document.createElement('p');
          meta.className = 'live-feed-meta';
          var evidenceMs = Date.parse(item.period_end + 'T23:59:59Z');
          var evidenceAgeDays = Math.max(0, Math.floor((now - evidenceMs) / (24 * 60 * 60 * 1000)));
          var evidenceAge = evidenceAgeDays === 0 ? 'evidence current today' : 'evidence ' + evidenceAgeDays + ' day' + (evidenceAgeDays === 1 ? '' : 's') + ' old';
          meta.textContent = item.geography + ' · ' + item.metric_name + ' · ' + item.cadence.replace(/_/g, ' ') + ' · ' + evidenceAge;
          var summary = document.createElement('p');
          summary.textContent = item.client_summary;
          var sourceUrl = new URL(item.source_url);
          var source = document.createElement('a');
          source.href = item.source_url;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          source.textContent = 'Official source: ' + sourceUrl.hostname + ' · evidence period ' + item.period_end;
          source.setAttribute('aria-label', 'Open official source for ' + item.title + ', evidence period ' + item.period_end);
          card.appendChild(title);
          card.appendChild(meta);
          card.appendChild(summary);
          card.appendChild(source);
          items.appendChild(card);
        });
        region.setAttribute('aria-hidden', 'false');
        return feed;
      })
      .catch(function (error) {
        window.RADAR_PUBLIC_FEED = null;
        var status = document.getElementById('feedStatus');
        var snapshot = window.RADAR_DATA && window.RADAR_DATA.meta ? window.RADAR_DATA.meta.updated : null;
        var snapshotMs = typeof snapshot === 'string' ? Date.parse(snapshot) : NaN;
        var snapshotDetail = '';
        if (Number.isFinite(snapshotMs)) {
          var snapshotAgeDays = Math.max(0, Math.floor((Date.now() - snapshotMs) / (24 * 60 * 60 * 1000)));
          snapshotDetail = ' Snapshot dated ' + new Date(snapshotMs).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) + ' (' + snapshotAgeDays + ' day' + (snapshotAgeDays === 1 ? '' : 's') + ' old).';
        }
        var reason = 'The validated live feed could not be retrieved.';
        if (error && error.message === 'feed-stale') reason = 'The validated live feed is older than the 48-hour freshness limit.';
        if (error && error.message === 'feed-invalid') reason = 'The validated live feed failed integrity, provenance or schema checks.';
        status.innerHTML = '<strong>Historical preview — not current data.</strong> ' + reason + snapshotDetail + ' Figures below are historical context only and must not be treated as current intelligence. <button type="button" class="feed-retry">Retry live feed</button>';
        var retry = status.querySelector('.feed-retry');
        if (retry) retry.addEventListener('click', function () { window.location.reload(); });
        status.setAttribute('aria-hidden', 'false');
        document.getElementById('liveFeed').setAttribute('aria-hidden', 'true');
        document.documentElement.setAttribute('data-feed-state', 'stale');
        return null;
      });
  </script>
  <script src="app.js"></script>
  <script src="partner-network.js"></script>
</body>
</html>
